version: '3.8'

services:
  collision-detection:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - DEBUG=False
      - UPLOAD_FOLDER=/app/uploads
      - LOG_DIRECTORY=/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - collision-detection
    restart: unless-stopped