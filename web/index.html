<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Analysis & Hardware Control System</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Video Analysis & Hardware Control System</h1>
            <nav>
                <button id="video-tab" class="tab-button active">Video Analysis</button>
                <button id="live-tab" class="tab-button">Live Feed</button>
                <button id="hardware-tab" class="tab-button">Hardware Control</button>
                <button id="monitoring-tab" class="tab-button">System Monitor</button>
            </nav>
        </header>

        <main>
            <!-- Video Analysis Tab -->
            <div id="video-panel" class="panel active">
                <div class="upload-section">
                    <h3>Upload Video for Analysis</h3>
                    <input type="file" id="video-upload" accept="video/mp4,video/avi,video/mov,video/webm">
                    <div id="upload-progress" class="progress-bar">
                        <div id="upload-progress-fill"></div>
                    </div>
                </div>
                <div class="video-display">
                    <video id="analysis-video" controls></video>
                    <div id="collision-overlay"></div>
                </div>
                <div id="analysis-results"></div>
            </div>

            <!-- Live Feed Tab -->
            <div id="live-panel" class="panel">
                <div class="camera-controls">
                    <h3>Camera Feeds</h3>
                    <select id="camera-select">
                        <option value="">Select Camera</option>
                    </select>
                    <button id="connect-camera">Connect</button>
                </div>
                <div class="live-display">
                    <video id="live-video" autoplay></video>
                    <div id="live-overlay"></div>
                </div>
                <div id="live-alerts"></div>
            </div>

            <!-- Hardware Control Tab -->
            <div id="hardware-panel" class="panel">
                <div class="device-list">
                    <h3>ESP8266 Devices</h3>
                    <div id="device-status"></div>
                </div>
                <div class="manual-controls">
                    <h3>Manual Control</h3>
                    <div class="control-buttons">
                        <button id="test-leds" class="btn btn-warning">Test All LEDs</button>
                        <button id="test-servos" class="btn btn-info">Test All Servos</button>
                        <button id="test-relays" class="btn btn-secondary">Test All Relays</button>
                    </div>
                </div>
                <div class="logs-section">
                    <h3>Hardware Logs</h3>
                    <div id="hardware-logs"></div>
                </div>
            </div>

            <!-- System Monitoring Tab -->
            <div id="monitoring-panel" class="panel">
                <!-- Content will be dynamically generated by MonitoringDashboard.js -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="src/core/CollisionSystem.js"></script>
    <script src="src/video/VideoUploader.js"></script>
    <script src="src/video/LiveFeedViewer.js"></script>
    <script src="src/hardware/HardwareInterface.js"></script>
    <script src="src/ui/TabManager.js"></script>
    <script src="src/ui/MonitoringDashboard.js"></script>
    <script src="src/test/integration-tests.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
