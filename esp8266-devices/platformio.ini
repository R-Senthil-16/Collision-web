[platformio]
default_envs = esp8266_generic

[env:esp8266_generic]
platform = espressif8266
board = nodemcuv2
framework = arduino

# Build configuration
build_flags = 
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -fexceptions
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_WIFI
    -DDEBUG_ESP_HTTP_CLIENT

# Upload configuration
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

# Library dependencies
lib_deps = 
    # WiFi and networking
    ESP8266WiFi
    ESP8266WebServer
    ESP8266HTTPClient
    ESP8266mDNS
    
    # JSON handling
    ArduinoJson@^6.21.4
    
    # MQTT communication
    PubSubClient@^2.8.0
    
    # Servo control
    Servo@^1.2.1
    
    # NTP time synchronization
    NTPClient@^3.2.1
    
    # Async operations
    ESPAsyncTCP@^1.2.2
    ESPAsyncWebServer@^1.2.3
    
    # OTA updates
    ArduinoOTA@^1.0.9
    
    # Utilities
    StreamUtils@^1.7.3

# Development environment
[env:esp8266_debug]
extends = env:esp8266_generic
build_type = debug
build_flags = 
    ${env:esp8266_generic.build_flags}
    -DDEBUG=1
    -DCORE_DEBUG_LEVEL=5

# Production environment
[env:esp8266_release]
extends = env:esp8266_generic
build_type = release
build_flags = 
    ${env:esp8266_generic.build_flags}
    -DNDEBUG
    -Os

# Testing environment
[env:native]
platform = native
build_flags = 
    -std=c++11
    -DUNIT_TEST
    -DDEBUG=1
lib_deps = 
    ArduinoJson@^6.21.4
test_framework = unity
test_build_project_src = true

# ESP8266 testing environment (for hardware-specific tests)
[env:esp8266_test]
extends = env:esp8266_generic
build_flags = 
    ${env:esp8266_generic.build_flags}
    -DUNIT_TEST
    -DDEBUG=1
test_framework = unity
test_build_project_src = true